name: savia_dev

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: savia_dev_postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - savia_dev_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savia_dev_backend
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      PORT: ${PORT:-8001}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-savia-logs}
      S3_REGION: ${S3_REGION:-us-east-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OBS_DATA_PATH: /app/data
      OBS_DISK_ALERT_PERCENT: ${OBS_DISK_ALERT_PERCENT:-85}
      OBS_DB_ALERT_BYTES: ${OBS_DB_ALERT_BYTES:-0}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_API_KEYS: ${GOOGLE_API_KEYS}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.1-flash-lite}
      GEMINI_ATTEMPT_TIMEOUT_SECONDS: ${GEMINI_ATTEMPT_TIMEOUT_SECONDS:-35}
      AI_PROVIDER: ${AI_PROVIDER:-google}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-https://api.fireworks.ai/inference/v1}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/deepseek-v4-flash-0731}
      FIREWORKS_ATTEMPT_TIMEOUT_SECONDS: ${FIREWORKS_ATTEMPT_TIMEOUT_SECONDS:-120}
      MASTER_KEY: ${MASTER_KEY}
      ACCESS_CODE: ${ACCESS_CODE}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8001/" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - savia_dev_network

  # Exécuteur privé des rappels quotidiens. Le backend API ne lance plus de thread.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savia_dev_scheduler
    command: [ "python", "-m", "workers.scheduler" ]
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      PASSWORD_ROTATION_DAYS: ${PASSWORD_ROTATION_DAYS:-90}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-30}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - savia_dev_network

  minio:
    image: minio/minio:latest
    container_name: savia_dev_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - savia_dev_network

  # Next.js Admin Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8001}
    container_name: savia_dev_frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8001}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - savia_dev_network

  # SAVIA Site - PWA Techniciens
  pwa-site:
    build:
      context: ./pwa-site
      dockerfile: Dockerfile
    container_name: savia_dev_pwa
    ports:
      - "3001:3001"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8001}
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - savia_dev_network

volumes:
  pgdata_dev:
    driver: local
  minio_data_dev:
    driver: local

networks:
  savia_dev_network:
    driver: bridge
