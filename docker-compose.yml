services:
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MINIO}
    command: server /data --console-address ":9001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8001"
    volumes:
      - backend_data:/app/data
    environment:
      PORT: "8001"
      NODE_ENV: production
      JWT_SECRET: ${SERVICE_REALBASE64_64_JWT}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      PASSWORD_ROTATION_DAYS: ${PASSWORD_ROTATION_DAYS:-90}
      DATABASE_URL: ${DATABASE_URL:?}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${SERVICE_USER_MINIO}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_MINIO}
      S3_BUCKET: ${S3_BUCKET:-savia-logs}
      S3_REGION: ${S3_REGION:-us-east-1}
      MAX_FICHE_SIZE_MB: ${MAX_FICHE_SIZE_MB:-10}
      MAX_DOCUMENT_TECHNIQUE_SIZE_MB: ${MAX_DOCUMENT_TECHNIQUE_SIZE_MB:-20}
      MAX_LOG_SIZE_MB: ${MAX_LOG_SIZE_MB:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OBS_DATA_PATH: /app/data
      OBS_DISK_ALERT_PERCENT: ${OBS_DISK_ALERT_PERCENT:-85}
      OBS_DB_ALERT_BYTES: ${OBS_DB_ALERT_BYTES:-0}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_API_KEYS: ${GOOGLE_API_KEYS:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.1-flash-lite}
      GEMINI_ATTEMPT_TIMEOUT_SECONDS: ${GEMINI_ATTEMPT_TIMEOUT_SECONDS:-35}
      AI_PROVIDER: ${AI_PROVIDER:-google}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-https://api.fireworks.ai/inference/v1}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/deepseek-v4-flash-0731}
      FIREWORKS_ATTEMPT_TIMEOUT_SECONDS: ${FIREWORKS_ATTEMPT_TIMEOUT_SECONDS:-120}
      MASTER_KEY: ${MASTER_KEY:-}
      ACCESS_CODE: ${ACCESS_CODE:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # Single non-HTTP executor for daily reminders and maintenance jobs.
  # It is deliberately private: no port and no public domain are exposed.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "workers.scheduler"]
    environment:
      NODE_ENV: production
      JWT_SECRET: ${SERVICE_REALBASE64_64_JWT}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      PASSWORD_ROTATION_DAYS: ${PASSWORD_ROTATION_DAYS:-90}
      DATABASE_URL: ${DATABASE_URL:?}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-30}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        BACKEND_URL: http://backend:8001
    expose:
      - "3000"
    environment:
      BACKEND_URL: http://backend:8001
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  pwa-site:
    build:
      context: ./pwa-site
      dockerfile: Dockerfile
    expose:
      - "3001"
    environment:
      BACKEND_URL: http://backend:8001
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  backend_data:
  minio_data:
