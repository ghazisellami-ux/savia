name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge-after-ci:
    name: Resolve Dependabot PR after CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve eligible Dependabot pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deleteDependabotBranch = async (pullRequest) => {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${pullRequest.head.ref}`,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };
            let dependabotPullRequests;
            if (context.eventName === 'workflow_run') {
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.payload.workflow_run.head_sha,
              });
              dependabotPullRequests = pullRequests;
            } else {
              const { data: pullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              dependabotPullRequests = pullRequests;
            }

            dependabotPullRequests = dependabotPullRequests.filter((pullRequest) =>
              pullRequest.state === 'open' &&
              pullRequest.user?.login === 'dependabot[bot]' &&
              pullRequest.head.repo?.full_name === `${owner}/${repo}`
            );

            for (const pullRequest of dependabotPullRequests) {
              let ciSucceeded = context.eventName === 'workflow_run' &&
                context.payload.workflow_run.conclusion === 'success';
              let ciFailed = context.eventName === 'workflow_run' &&
                context.payload.workflow_run.conclusion !== 'success';
              if (context.eventName !== 'workflow_run') {
                const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  head_sha: pullRequest.head.sha,
                  per_page: 100,
                });
                const ciRuns = runs.workflow_runs
                  .filter((run) =>
                    run.name === 'CI/CD Pipeline' &&
                    run.head_sha === pullRequest.head.sha &&
                    run.event === 'pull_request'
                  )
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                const latestCiRun = ciRuns[0];
                ciSucceeded = latestCiRun?.status === 'completed' &&
                  latestCiRun.conclusion === 'success';
                ciFailed = latestCiRun?.status === 'completed' &&
                  latestCiRun.conclusion !== 'success';
              }
              if (!ciSucceeded) {
                core.info(`PR #${pullRequest.number} ignorée : la dernière CI n'est pas réussie.`);
                if (ciFailed) {
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pullRequest.number,
                    state: 'closed',
                  });
                  await deleteDependabotBranch(pullRequest);
                }
                continue;
              }

              const merge = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pullRequest.number,
                merge_method: 'squash',
              });

              if (!merge.data.merged) {
                core.warning(`PR #${pullRequest.number} n'a pas été fusionnée : ${merge.data.message}`);
                continue;
              }

              // Remove the Dependabot branch after a successful merge so it
              // does not accumulate alongside the project's working branches.
              await deleteDependabotBranch(pullRequest);
            }

            // Remove closed/stale Dependabot branches, while preserving every
            // branch that still backs an open Dependabot pull request.
            const { data: openPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const openDependabotRefs = new Set(
              openPullRequests
                .filter((pullRequest) =>
                  pullRequest.user?.login === 'dependabot[bot]' &&
                  pullRequest.head.repo?.full_name === `${owner}/${repo}`
                )
                .map((pullRequest) => pullRequest.head.ref)
            );
            const { data: branches } = await github.rest.repos.listBranches({
              owner,
              repo,
              per_page: 100,
            });
            for (const branch of branches.filter((item) =>
              item.name.startsWith('dependabot/') && !openDependabotRefs.has(item.name)
            )) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
