version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: numpy
        versions: [">= 2.5.0"]

  - package-ecosystem: npm
    directory: /frontend
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: typescript
        versions: [">= 6.1.0"]

  - package-ecosystem: npm
    directory: /pwa-site
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    groups:
      pwa-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: typescript
        versions: [">= 6.1.0"]
